<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="doc.title">Reisetagebuch — Camino Portugués | Barvenko</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/uebersetzungen/tagebuch.js"></script>
    <script src="js/i18n.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tagebuch.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="index.html#hero" class="nav-logo">BARVENKO</a>
        <div class="nav-links">
            <a href="index.html#about" data-i18n="nav.about">Über mich</a>
            <a href="index.html#gallery" data-i18n="nav.gallery">Galerie</a>
            <a href="index.html#adventures" data-i18n="nav.adventures">Abenteuer</a>
            <a href="jakobsweg.html" data-i18n="nav.jakobsweg">Reiseführer</a>
            <a href="index.html#contact" data-i18n="nav.contact">Kontakt</a>
            <div class="lang-switch">
                <button data-lang="de" onclick="I18N_setLang('de')">DE</button>
                <button data-lang="en" onclick="I18N_setLang('en')">EN</button>
                <button data-lang="ru" onclick="I18N_setLang('ru')">RU</button>
            </div>
        </div>
        <button class="nav-toggle" data-i18n-aria-label="nav.toggle" aria-label="Menü öffnen">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <a href="jakobsweg.html" class="diary-back"><span class="arrow">←</span> <span data-i18n="back.toGuide">Zurück zum Reiseführer</span></a>

    <header class="diary-hero">
        <div>
            <p class="kicker" data-i18n="hero.kicker">Camino Portugués</p>
            <h1 data-i18n="hero.title">Mein Reisetagebuch</h1>
        </div>
    </header>

    <div class="diary-wrap">
        <div class="diary-toolbar">
            <span class="diary-count" id="diary-count" data-i18n="count.loading">Lade Einträge …</span>
            <span class="diary-auth-status" id="diary-auth-status"></span>
        </div>
        <div id="diary-feed"></div>
    </div>

    <button class="diary-fab" id="diary-fab" data-i18n="fab.newDay">+ Neuer Tag</button>
    <div class="diary-lightbox" id="diary-lightbox">
        <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Schließen">✕</button>
        <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Zurück">‹</button>
        <img id="diary-lightbox-img" alt="">
        <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Weiter">›</button>
    </div>

    <!-- Fußzeile -->
    <footer class="footer">
        <p data-i18n="footer.rights">&copy; 2026 Barvenko. Alle Rechte vorbehalten.</p>
        <p><a href="index.html">barvenko.de</a></p>
    </footer>

    <a href="#top" class="back-to-top" data-i18n-aria-label="backToTop.ariaLabel" aria-label="Nach oben">↑</a>

    <script src="js/navigation.js"></script>

    <script type="module" src="js/tagebuch.js"></script>

</body>
</html>
