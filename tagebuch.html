<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="doc.title">Reisetagebuch — Camino Portugués | Barvenko</title>
    <link rel="stylesheet" href="style.css">
    <script src="i18n-tagebuch.js"></script>
    <script src="i18n.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #8a5a38; --accent-dark: #6b452b; --line: #e3ddd5; --text: #33302c; --text-soft: #45413b; --bg: #f6f1ea; --surface: #fffdfa; --danger: #a8422c; }
        body { font-weight: 400; color: var(--text); background: var(--bg); }

        .diary-hero {
            min-height: 40vh; display: flex; align-items: center; justify-content: center; text-align: center;
            color: #fff; padding: 7rem 1.5rem 3rem; position: relative;
            background: linear-gradient(135deg, rgba(70,50,35,0.72), rgba(120,90,60,0.55)), url('images/jakobsweg/deko-bergpfad.png');
            background-size: cover; background-position: center 30%;
        }
        .diary-back {
            position: fixed; top: 84px; left: 1rem; z-index: 15;
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: rgba(255,255,255,0.92); color: var(--accent-dark);
            padding: 0.6rem 1.1rem; border-radius: 999px; text-decoration: none;
            font-size: 0.85rem; font-weight: 500; box-shadow: 0 4px 14px rgba(60,45,25,0.25);
        }
        .diary-back:hover { background: #fff; }
        .diary-back .arrow { font-size: 1.1rem; line-height: 1; }
        @media (max-width: 700px) { .diary-back { top: 70px; } }
        .diary-hero .kicker { font-size: 0.8rem; letter-spacing: 0.35em; text-transform: uppercase; opacity: 0.9; margin-bottom: 1rem; }
        .diary-hero h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: 0.03em; }

        .diary-wrap { max-width: 640px; margin: 0 auto; padding: 2.5rem 1.2rem 6rem; }

        .diary-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .diary-count { font-size: 0.82rem; color: #6a655d; }
        .diary-auth-status { font-size: 0.78rem; color: #6a655d; }
        .diary-auth-status button { background: none; border: none; color: var(--accent-dark); text-decoration: underline; cursor: pointer; font-size: inherit; padding: 0; }

        .diary-empty { text-align: center; padding: 3.5rem 1rem; color: #948c7d; }
        .diary-empty .shell { font-size: 2.2rem; display: block; margin-bottom: 0.8rem; }

        .diary-feed { display: flex; flex-direction: column; gap: 1.1rem; }
        .diary-entry {
            background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
            padding: 1.1rem 1.2rem 1.2rem; box-shadow: 0 2px 10px rgba(60,45,25,0.08); position: relative;
            cursor: pointer;
        }
        .diary-entry:hover { border-color: var(--accent); }
        .diary-entry-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.6rem; margin-bottom: 0.4rem; }
        .diary-entry-title { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.35rem; }
        .diary-entry-date { font-size: 0.72rem; letter-spacing: 0.03em; color: #948c7d; margin-top: 0.2rem; }
        .diary-entry-actions { display: flex; gap: 0.2rem; flex-shrink: 0; }
        .diary-entry-del, .diary-entry-edit { border: none; background: transparent; color: #b3a992; font-size: 1rem; cursor: pointer; padding: 0.3rem; border-radius: 6px; }
        .diary-entry-del:hover { color: var(--danger); background: #eadfcd; }
        .diary-entry-edit:hover { color: var(--accent-dark); background: #eadfcd; }
        .diary-entry-text { color: var(--text-soft); white-space: pre-wrap; margin: 0.5rem 0 0; line-height: 1.6; }
        .diary-entry-text-preview {
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
            overflow: hidden; white-space: pre-wrap; color: var(--text-soft); margin: 0.5rem 0 0; line-height: 1.6;
        }
        .diary-entry-more { font-size: 0.75rem; color: var(--accent-dark); margin-top: 0.3rem; }
        .diary-entry-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0.5rem; margin-top: 0.8rem; }
        .diary-entry-photos img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; display: block; }
        .diary-detail-date { font-size: 0.72rem; color: #948c7d; margin: 0.3rem 0 1rem; }
        .diary-detail-text { white-space: pre-wrap; line-height: 1.7; color: var(--text); }

        .diary-fab {
            position: fixed; bottom: 1.4rem; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: #fff; border: none; font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem; font-weight: 500; letter-spacing: 0.02em; padding: 0.85rem 1.6rem;
            border-radius: 999px; box-shadow: 0 6px 20px rgba(60,45,25,0.25); cursor: pointer;
            display: none; align-items: center; gap: 0.5rem; z-index: 10;
        }
        .diary-fab.show { display: flex; }
        .diary-fab:hover { background: var(--accent-dark); }

        .diary-backdrop {
            position: fixed; inset: 0; background: rgba(20,15,8,0.45); z-index: 20;
            display: none; align-items: center; justify-content: center;
            padding: 1.5rem 1rem; box-sizing: border-box;
        }
        .diary-backdrop.show { display: flex; }
        .diary-sheet {
            background: #fff; width: 100%; max-width: 640px; border-radius: 18px;
            padding: 1.4rem 1.2rem 1.6rem; max-height: 82vh; max-height: 82dvh; overflow-y: auto;
            -webkit-overflow-scrolling: touch; box-shadow: 0 12px 40px rgba(20,15,8,0.35);
        }
        .diary-sheet h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; color: var(--accent-dark); margin-bottom: 1rem; }
        .diary-field { margin-bottom: 1rem; }
        .diary-field label { display: block; font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 0.4rem; }
        .diary-field input[type="text"], .diary-field input[type="email"], .diary-field input[type="password"], .diary-field textarea {
            width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 0.7rem 0.8rem;
            font-family: inherit; font-size: 1rem; background: #fff; color: var(--text); box-sizing: border-box;
        }
        .diary-field textarea { resize: vertical; min-height: 6rem; }
        .diary-photo-picker { border: 1.5px dashed var(--line); border-radius: 10px; padding: 1rem; text-align: center; cursor: pointer; color: var(--text-soft); font-size: 0.85rem; display: block; }
        .diary-photo-picker input { display: none; }
        .diary-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 0.5rem; margin-top: 0.7rem; }
        .diary-preview-item { position: relative; }
        .diary-preview-item img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; display: block; }
        .diary-preview-remove { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--danger); color: #fff; border: none; font-size: 0.8rem; cursor: pointer; }
        .diary-sheet-actions { display: flex; gap: 0.7rem; margin-top: 1.2rem; }
        .diary-btn { flex: 1; border-radius: 10px; padding: 0.8rem 1rem; font-size: 0.9rem; font-family: inherit; font-weight: 500; cursor: pointer; border: 1px solid transparent; }
        .diary-btn-primary { background: var(--accent); color: #fff; }
        .diary-btn-primary:hover { background: var(--accent-dark); }
        .diary-btn-primary:disabled { opacity: 0.6; cursor: default; }
        .diary-btn-secondary { background: transparent; color: var(--text-soft); border-color: var(--line); }
        .diary-error { color: var(--danger); font-size: 0.82rem; margin-top: 0.6rem; display: none; }
        .diary-error.show { display: block; }
        .translate-preview { margin-top: 0.9rem; display: none; flex-direction: column; gap: 0.7rem; }
        .translate-preview.show { display: flex; }
        .translate-preview-hint { font-size: 0.75rem; color: #948c7d; }
        .translate-preview-block { background: #f6f1ea; border-radius: 10px; padding: 0.7rem 0.85rem; font-size: 0.88rem; }
        .translate-preview-block strong { display: block; font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent-dark); margin-bottom: 0.3rem; }
        .translate-preview-title { font-weight: 600; margin-bottom: 0.2rem; }
        .translate-preview-text { color: var(--text-soft); white-space: pre-wrap; line-height: 1.5; }
        .diary-auto-badge { font-size: 0.68rem; color: #948c7d; border: 1px solid var(--line); border-radius: 999px; padding: 0.15rem 0.5rem; margin-left: 0.5rem; white-space: nowrap; }
        .diary-translate-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.6rem; }
        .diary-translate-inline {
            display: inline-flex; align-items: center; gap: 0.35rem;
            border: 1px solid var(--accent); background: transparent; color: var(--accent-dark);
            border-radius: 999px; padding: 0.35rem 0.85rem; font-size: 0.78rem; font-family: inherit; cursor: pointer;
        }
        .diary-translate-inline:hover { background: var(--accent); color: #fff; }
        .diary-translate-inline:disabled { opacity: 0.6; cursor: default; }
        .diary-lightbox { position: fixed; inset: 0; background: rgba(10,8,5,0.9); z-index: 1001; display: none; align-items: center; justify-content: center; padding: 1.5rem; touch-action: pan-y; }
        .diary-lightbox.show { display: flex; }
        .diary-lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; user-select: none; -webkit-user-drag: none; }
        .lightbox-close, .lightbox-nav {
            position: absolute; background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 41;
        }
        .lightbox-close:hover, .lightbox-nav:hover { background: rgba(255,255,255,0.32); }
        .lightbox-close { top: 1rem; right: 1rem; width: 40px; height: 40px; font-size: 1.1rem; }
        .lightbox-nav { top: 50%; transform: translateY(-50%); width: 48px; height: 48px; font-size: 1.8rem; line-height: 1; }
        .lightbox-prev { left: 0.6rem; }
        .lightbox-next { right: 0.6rem; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import {
            getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
            onSnapshot, query, orderBy, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
        import {
            getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwpQ5RJhmg3EclFhCDxsvw7O8ExuA1jbs",
            authDomain: "camino-tagebuch.firebaseapp.com",
            projectId: "camino-tagebuch",
            storageBucket: "camino-tagebuch.firebasestorage.app",
            messagingSenderId: "496232405910",
            appId: "1:496232405910:web:e8eca9a786b91a67f59bb7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let isLoggedIn = false;
        let entries = [];
        let draftPhotos = [];

        function esc(s) {
            return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
                ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        function t(key, fallback) {
            const lang = (window.I18N_getLang && window.I18N_getLang()) || "de";
            const dict = (window.I18N && window.I18N[lang]) || {};
            return dict[key] != null ? dict[key] : fallback;
        }

        // ---- Translation (MyMemory: free, keyless, works on every device/browser) ----
        const ALL_LANGS = ["de", "en", "ru"];
        function otherLangs(sourceLang) { return ALL_LANGS.filter((l) => l !== sourceLang); }

        async function translateChunk(text, source, target) {
            if (!text.trim()) return "";
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${source}|${target}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error("HTTP " + res.status);
            const data = await res.json();
            if (data.responseStatus != 200 || !data.responseData) throw new Error(data.responseDetails || "Übersetzung fehlgeschlagen");
            return data.responseData.translatedText;
        }

        // MyMemory caps queries at 500 chars, so long diary entries are split into
        // sentence-sized pieces (per paragraph) and translated one at a time, then rejoined.
        function chunkParagraph(para, maxLen) {
            const chunks = [];
            let rest = para;
            while (rest.length > maxLen) {
                let cut = rest.lastIndexOf(". ", maxLen);
                if (cut < maxLen * 0.3) cut = rest.lastIndexOf(" ", maxLen);
                if (cut <= 0) cut = maxLen;
                chunks.push(rest.slice(0, cut + 1).trim());
                rest = rest.slice(cut + 1);
            }
            if (rest.trim()) chunks.push(rest.trim());
            return chunks;
        }

        async function translateLongText(text, source, target) {
            if (!text || !text.trim()) return "";
            const paragraphs = text.split(/\n+/);
            const out = [];
            for (const para of paragraphs) {
                if (!para.trim()) { out.push(""); continue; }
                const chunks = chunkParagraph(para.trim(), 450);
                const translatedChunks = [];
                for (const c of chunks) translatedChunks.push(await translateChunk(c, source, target));
                out.push(translatedChunks.join(" "));
            }
            return out.join("\n");
        }

        function pluralEntries(n) {
            const lang = (window.I18N_getLang && window.I18N_getLang()) || "de";
            if (lang === "en") return n === 1 ? "entry" : "entries";
            if (lang === "ru") {
                const mod10 = n % 10, mod100 = n % 100;
                if (mod10 === 1 && mod100 !== 11) return "запись";
                if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return "записи";
                return "записей";
            }
            return n === 1 ? "Eintrag" : "Einträge";
        }

        function formatDate(ts) {
            try {
                const d = ts && ts.toDate ? ts.toDate() : new Date(ts);
                const lang = (window.I18N_getLang && window.I18N_getLang()) || "de";
                const locale = lang === "en" ? "en-GB" : lang === "ru" ? "ru-RU" : "de-DE";
                return d.toLocaleString(locale, { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
            } catch (e) { return ""; }
        }

        function currentLang() { return (window.I18N_getLang && window.I18N_getLang()) || "de"; }

        // Decided purely from the actual text, never trusted from stored metadata alone —
        // a manually-picked "I'm writing in X" value is too easy to forget/leave wrong,
        // and that mismatch is exactly what silently broke translations before. Cyrillic
        // is unambiguous; anything else is assumed German (the site's base language).
        function detectLang(text) {
            return /[Ѐ-ӿ]/.test(text || "") ? "ru" : "de";
        }
        // A stored per-language field is only trusted if its own script actually matches
        // that language — this makes rendering self-healing against any bad data already
        // saved (e.g. a wrong source-language mirror from before this check existed).
        function fieldMatchesLang(value, lang) {
            if (!value) return false;
            const looksRu = /[Ѐ-ӿ]/.test(value);
            return lang === "ru" ? looksRu : !looksRu;
        }
        function hasTrustedField(entry, field, lang) {
            const v = entry[field + "_" + lang];
            return v != null && v !== "" && fieldMatchesLang(v, lang);
        }

        function localizedField(entry, field, lang) {
            if (hasTrustedField(entry, field, lang)) return entry[field + "_" + lang];
            return entry[field] || "";
        }
        function isAutoTranslated(entry, lang) {
            if (!hasTrustedField(entry, "title", lang)) return false;
            return detectLang(entry.title || entry.text || "") !== lang;
        }
        function autoBadge(entry, lang) {
            return isAutoTranslated(entry, lang)
                ? `<span class="diary-auto-badge">🌐 ${esc(t('entry.autoTranslated', 'automatisch übersetzt'))}</span>`
                : "";
        }
        // Always the same 3 buttons (DE/EN/RU), everywhere, regardless of the site's
        // current language — clicking one shows THIS entry in that language, on top of
        // whatever the site language happens to be.
        function langButtonsHtml(entryId) {
            return `<div class="diary-translate-row">${ALL_LANGS.map((l) =>
                `<button type="button" class="diary-translate-inline" data-entry-id="${esc(entryId)}" data-target-lang="${l}">${l.toUpperCase()}</button>`
            ).join("")}</div>`;
        }

        const onDemandTranslateCache = {};
        async function switchEntryLang(entry, targetLang, titleEl, textEl, btn) {
            const origTitle = entry.title || "";
            const origText = entry.text || "";
            if (detectLang(origTitle || origText) === targetLang) {
                if (titleEl) titleEl.textContent = origTitle;
                if (textEl) textEl.textContent = origText;
                return;
            }
            if (hasTrustedField(entry, "title", targetLang)) {
                if (titleEl) titleEl.textContent = entry["title_" + targetLang];
                if (textEl) textEl.textContent = entry["text_" + targetLang] || "";
                return;
            }
            const cacheKey = entry.id + "_" + targetLang;
            if (onDemandTranslateCache[cacheKey]) {
                if (titleEl) titleEl.textContent = onDemandTranslateCache[cacheKey].title;
                if (textEl) textEl.textContent = onDemandTranslateCache[cacheKey].text;
                return;
            }
            const source = detectLang(origTitle || origText);
            const origLabel = btn.textContent;
            btn.disabled = true;
            btn.textContent = "…";
            try {
                const title = origTitle ? await translateLongText(origTitle, source, targetLang) : "";
                const text = origText ? await translateLongText(origText, source, targetLang) : "";
                onDemandTranslateCache[cacheKey] = { title, text };
                if (titleEl) titleEl.textContent = title;
                if (textEl) textEl.textContent = text;
            } catch (err) {
                alert(t('entry.translateFailedAlert', 'Übersetzung fehlgeschlagen.'));
            } finally {
                btn.disabled = false;
                btn.textContent = origLabel;
            }
        }

        function renderEntry(entry) {
            const lang = currentLang();
            const title = localizedField(entry, "title", lang);
            const text = localizedField(entry, "text", lang);
            const photos = (entry.photos || []).map(p =>
                `<img src="${p}" alt="${esc(t('photo.alt', 'Foto zum Tagebucheintrag'))}" loading="lazy">`).join("");
            return `
                <article class="diary-entry" data-open="${esc(entry.id)}">
                    <div class="diary-entry-head">
                        <div>
                            <div class="diary-entry-title" data-title-el="${esc(entry.id)}">${esc(title)}${autoBadge(entry, lang)}</div>
                            <div class="diary-entry-date">${esc(formatDate(entry.createdAt))}</div>
                        </div>
                        ${isLoggedIn ? `<div class="diary-entry-actions">
                            <button class="diary-entry-edit" aria-label="${esc(t('entry.edit', 'Bearbeiten'))}" data-edit="${esc(entry.id)}">✏️</button>
                            <button class="diary-entry-del" aria-label="${esc(t('entry.delete', 'Löschen'))}" data-del="${esc(entry.id)}">✕</button>
                        </div>` : ""}
                    </div>
                    ${text ? `<p class="diary-entry-text-preview" data-text-el="${esc(entry.id)}">${esc(text)}</p><p class="diary-entry-more">${esc(t('entry.readMore', 'Weiterlesen →'))}</p>` : ""}
                    ${langButtonsHtml(entry.id)}
                    ${photos ? `<div class="diary-entry-photos">${photos}</div>` : ""}
                </article>`;
        }

        async function deleteEntry(id, triggerBtn) {
            if (!confirm(t('entry.delete.confirm', 'Diesen Eintrag wirklich löschen?'))) return;
            if (triggerBtn) triggerBtn.disabled = true;
            try {
                await deleteDoc(doc(db, "entries", id));
                closeBackdrop();
            } catch (e) {
                alert(t('entry.delete.failed', 'Löschen fehlgeschlagen: ') + e.message);
                if (triggerBtn) triggerBtn.disabled = false;
            }
        }

        function openDetailView(entry) {
            const lang = currentLang();
            const title = localizedField(entry, "title", lang);
            const text = localizedField(entry, "text", lang);
            const photos = (entry.photos || []).map(p =>
                `<img src="${p}" alt="${esc(t('photo.alt', 'Foto zum Tagebucheintrag'))}">`).join("");
            const div = openBackdrop(`
                <h2 id="detail-title">${esc(title)}${autoBadge(entry, lang)}</h2>
                <div class="diary-detail-date">${esc(formatDate(entry.createdAt))}</div>
                ${langButtonsHtml(entry.id)}
                ${text ? `<p class="diary-detail-text" id="detail-text">${esc(text)}</p>` : ""}
                ${photos ? `<div class="diary-entry-photos" style="margin-top:1rem">${photos}</div>` : ""}
                ${isLoggedIn ? `<div class="diary-sheet-actions">
                    <button type="button" class="diary-btn diary-btn-secondary" id="detail-edit">${esc(t('entry.edit', 'Bearbeiten'))}</button>
                    <button type="button" class="diary-btn diary-btn-secondary" id="detail-del" style="color:var(--danger);border-color:var(--danger)">${esc(t('entry.delete', 'Löschen'))}</button>
                </div>` : ""}`);
            div.querySelectorAll("[data-target-lang]").forEach((btn) => {
                btn.addEventListener("click", () => {
                    switchEntryLang(entry, btn.getAttribute("data-target-lang"), div.querySelector("#detail-title"), div.querySelector("#detail-text"), btn);
                });
            });
            if (isLoggedIn) {
                div.querySelector("#detail-edit").addEventListener("click", () => openEntrySheet(entry));
                div.querySelector("#detail-del").addEventListener("click", (e) => deleteEntry(entry.id, e.target));
            }
            const detailImgs = Array.from(div.querySelectorAll(".diary-entry-photos img"));
            detailImgs.forEach((img, idx) => {
                img.addEventListener("click", () => openLightbox(detailImgs.map((i) => i.src), idx));
            });
        }

        function paint() {
            const feed = document.getElementById("diary-feed");
            const count = document.getElementById("diary-count");
            count.textContent = entries.length + " " + pluralEntries(entries.length);
            feed.innerHTML = entries.length
                ? `<div class="diary-feed">${entries.map(renderEntry).join("")}</div>`
                : `<div class="diary-empty"><span class="shell">🐚</span><p>${esc(t('empty.text', 'Noch keine Einträge. Der erste Tag auf dem Camino beginnt hier.'))}</p></div>`;

            feed.querySelectorAll("[data-open]").forEach(card => {
                card.addEventListener("click", (e) => {
                    if (e.target.closest("[data-del],[data-edit],[data-target-lang],img")) return;
                    const entry = entries.find(x => x.id === card.getAttribute("data-open"));
                    if (entry) openDetailView(entry);
                });
            });
            feed.querySelectorAll("[data-edit]").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const entry = entries.find(x => x.id === btn.getAttribute("data-edit"));
                    if (entry) openEntrySheet(entry);
                });
            });
            feed.querySelectorAll("[data-del]").forEach(btn => {
                btn.addEventListener("click", (e) => { e.stopPropagation(); deleteEntry(btn.getAttribute("data-del"), btn); });
            });
            feed.querySelectorAll("[data-target-lang]").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const id = btn.getAttribute("data-entry-id");
                    const entry = entries.find(x => x.id === id);
                    if (!entry) return;
                    const targetLang = btn.getAttribute("data-target-lang");
                    const titleEl = feed.querySelector(`[data-title-el="${CSS.escape(id)}"]`);
                    const textEl = feed.querySelector(`[data-text-el="${CSS.escape(id)}"]`);
                    switchEntryLang(entry, targetLang, titleEl, textEl, btn);
                });
            });
            feed.querySelectorAll(".diary-entry-photos").forEach(container => {
                const imgs = Array.from(container.querySelectorAll("img"));
                imgs.forEach((img, idx) => {
                    img.addEventListener("click", (e) => {
                        e.stopPropagation();
                        openLightbox(imgs.map((i) => i.src), idx);
                    });
                });
            });

            document.getElementById("diary-fab").classList.toggle("show", isLoggedIn);
            renderAuthStatus();
        }

        function renderAuthStatus() {
            const el = document.getElementById("diary-auth-status");
            if (isLoggedIn) {
                el.innerHTML = `${esc(t('auth.loggedIn', 'Angemeldet'))} · <button id="logout-btn">${esc(t('auth.logout', 'Abmelden'))}</button>`;
                document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));
            } else {
                el.innerHTML = `<button id="login-btn">${esc(t('auth.login', 'Anmelden'))}</button>`;
                document.getElementById("login-btn").addEventListener("click", openLoginSheet);
            }
        }

        onSnapshot(query(collection(db, "entries"), orderBy("createdAt", "desc")), (snap) => {
            entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            paint();
        }, (err) => {
            document.getElementById("diary-count").textContent = t('count.error', 'Fehler beim Laden.');
            console.error(err);
        });

        document.addEventListener("i18n:applied", () => { paint(); });

        onAuthStateChanged(auth, (user) => {
            isLoggedIn = !!user;
            paint();
        });

        function openBackdrop(innerHtml) {
            closeBackdrop();
            const div = document.createElement("div");
            div.className = "diary-backdrop show";
            div.id = "diary-backdrop";
            div.innerHTML = `<div class="diary-sheet">${innerHtml}</div>`;
            document.body.appendChild(div);
            div.addEventListener("click", (e) => { if (e.target === div) closeBackdrop(); });
            return div;
        }
        function closeBackdrop() {
            const b = document.getElementById("diary-backdrop");
            if (b) b.remove();
            draftPhotos = [];
        }

        function openLoginSheet() {
            const div = openBackdrop(`
                <h2>${esc(t('login.title', 'Anmelden'))}</h2>
                <div class="diary-field"><label for="login-email">${esc(t('login.email', 'E-Mail'))}</label><input type="email" id="login-email" autocomplete="email"></div>
                <div class="diary-field"><label for="login-pw">${esc(t('login.password', 'Passwort'))}</label><input type="password" id="login-pw" autocomplete="current-password"></div>
                <div class="diary-error" id="login-error"></div>
                <div class="diary-sheet-actions">
                    <button type="button" class="diary-btn diary-btn-secondary" id="login-cancel">${esc(t('login.cancel', 'Abbrechen'))}</button>
                    <button type="button" class="diary-btn diary-btn-primary" id="login-submit">${esc(t('login.submit', 'Anmelden'))}</button>
                </div>`);
            div.querySelector("#login-cancel").addEventListener("click", closeBackdrop);
            div.querySelector("#login-submit").addEventListener("click", async () => {
                const email = div.querySelector("#login-email").value.trim();
                const pw = div.querySelector("#login-pw").value;
                const btn = div.querySelector("#login-submit");
                const errEl = div.querySelector("#login-error");
                btn.disabled = true; btn.textContent = t('login.checking', 'Prüfe …');
                try {
                    await signInWithEmailAndPassword(auth, email, pw);
                    closeBackdrop();
                } catch (e) {
                    errEl.textContent = t('login.failed', 'Anmeldung fehlgeschlagen — E-Mail oder Passwort falsch.');
                    errEl.classList.add("show");
                    btn.disabled = false; btn.textContent = t('login.submit', 'Anmelden');
                }
            });
        }

        function resizeImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error("read-failed"));
                reader.onload = () => {
                    const img = new Image();
                    img.onerror = () => reject(new Error("decode-failed"));
                    img.onload = () => {
                        const maxDim = 1100;
                        let w = img.width, h = img.height;
                        if (w > maxDim || h > maxDim) {
                            if (w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
                            else { w = Math.round(w * (maxDim / h)); h = maxDim; }
                        }
                        const canvas = document.createElement("canvas");
                        canvas.width = w; canvas.height = h;
                        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL("image/jpeg", 0.62));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function renderPreviewGrid(container) {
            container.innerHTML = draftPhotos.map((p, i) => `
                <div class="diary-preview-item"><img src="${p}" alt="${esc(t('preview.alt', 'Vorschau'))}">
                <button type="button" class="diary-preview-remove" data-remove="${i}" aria-label="${esc(t('preview.remove', 'Entfernen'))}">✕</button></div>`).join("");
            container.querySelectorAll("[data-remove]").forEach(btn => {
                btn.addEventListener("click", () => {
                    draftPhotos.splice(Number(btn.getAttribute("data-remove")), 1);
                    renderPreviewGrid(container);
                });
            });
        }

        function openEntrySheet(existingEntry) {
            const div = openBackdrop(`
                <h2>${existingEntry ? esc(t('entrySheet.editTitle', 'Tag bearbeiten')) : esc(t('entrySheet.title', 'Neuer Tag'))}</h2>
                <div class="diary-field"><label for="entry-title">${esc(t('entrySheet.titleLabel', 'Tag-Titel'))}</label>
                <input type="text" id="entry-title" placeholder="${esc(t('entrySheet.titlePlaceholder', 'z. B. Tag 3 – Barcelos'))}" value="${existingEntry ? esc(existingEntry.title || "") : ""}"></div>
                <div class="diary-field"><label for="entry-text">${esc(t('entrySheet.textLabel', 'Wie war dein Tag?'))}</label>
                <textarea id="entry-text" placeholder="${esc(t('entrySheet.textPlaceholder', 'Erzähl, wie es dir geht, was du gesehen hast …'))}">${existingEntry ? esc(existingEntry.text || "") : ""}</textarea></div>
                <div class="diary-field"><label>${esc(t('entrySheet.photosLabel', 'Fotos'))}</label>
                    <label class="diary-photo-picker">${esc(t('entrySheet.addPhotos', '📷 Fotos hinzufügen'))}<input type="file" id="entry-photos" accept="image/*" multiple></label>
                    <div class="diary-preview-grid" id="entry-preview"></div>
                </div>
                <div class="diary-field">
                    <div class="diary-translate-row">${ALL_LANGS.map((l) => `<button type="button" class="diary-translate-inline" data-target-lang="${l}">${l.toUpperCase()}</button>`).join("")}</div>
                    <div class="translate-preview" id="translate-preview"></div>
                </div>
                <div class="diary-error" id="entry-error"></div>
                <div class="diary-sheet-actions">
                    <button type="button" class="diary-btn diary-btn-secondary" id="entry-cancel">${esc(t('entrySheet.cancel', 'Abbrechen'))}</button>
                    <button type="button" class="diary-btn diary-btn-primary" id="entry-save">${esc(t('entrySheet.save', 'Speichern'))}</button>
                </div>`);
            draftPhotos = existingEntry ? (existingEntry.photos || []).slice() : [];
            const previewEl = div.querySelector("#entry-preview");
            renderPreviewGrid(previewEl);
            div.querySelector("#entry-cancel").addEventListener("click", closeBackdrop);
            div.querySelector("#entry-photos").addEventListener("change", async (e) => {
                const files = Array.from(e.target.files || []);
                for (const f of files) {
                    try { draftPhotos.push(await resizeImage(f)); } catch (err) { /* skip */ }
                }
                renderPreviewGrid(previewEl);
                e.target.value = "";
            });

            const titleInput = div.querySelector("#entry-title");
            const textArea = div.querySelector("#entry-text");
            const translatePreviewEl = div.querySelector("#translate-preview");
            let translatedFor = null; // "title::text" these translations were generated from
            let translatedMap = {}; // { de: {title,text}, ru: {...} } — only the langs actually fetched

            function resetTranslateState() {
                translatedFor = null;
                translatedMap = {};
                translatePreviewEl.classList.remove("show");
                translatePreviewEl.innerHTML = "";
            }
            titleInput.addEventListener("input", resetTranslateState);
            textArea.addEventListener("input", resetTranslateState);

            function renderTranslatePreview() {
                const langs = Object.keys(translatedMap);
                if (!langs.length) { translatePreviewEl.classList.remove("show"); translatePreviewEl.innerHTML = ""; return; }
                translatePreviewEl.innerHTML = `<div class="translate-preview-hint">${esc(t('entrySheet.translatePreviewHint', 'Bitte kurz prüfen:'))}</div>` +
                    langs.map((l) => `
                        <div class="translate-preview-block">
                            <strong>${l.toUpperCase()}</strong>
                            <div class="translate-preview-title">${esc(translatedMap[l].title)}</div>
                            <div class="translate-preview-text">${esc(translatedMap[l].text)}</div>
                        </div>`).join("");
                translatePreviewEl.classList.add("show");
            }

            div.querySelectorAll(".diary-translate-row [data-target-lang]").forEach((btn) => {
                btn.addEventListener("click", async () => {
                    const title = titleInput.value.trim();
                    const text = textArea.value.trim();
                    if (!title && !text) return;
                    const key = title + "::" + text;
                    if (translatedFor !== key) { translatedFor = key; translatedMap = {}; }
                    const targetLang = btn.getAttribute("data-target-lang");
                    const source = detectLang(title + " " + text);
                    if (targetLang === source) {
                        translatedMap[targetLang] = { title, text };
                        renderTranslatePreview();
                        return;
                    }
                    if (translatedMap[targetLang]) { renderTranslatePreview(); return; }
                    const origLabel = btn.textContent;
                    btn.disabled = true;
                    btn.textContent = "…";
                    try {
                        const tTitle = title ? await translateLongText(title, source, targetLang) : "";
                        const tText = text ? await translateLongText(text, source, targetLang) : "";
                        translatedMap[targetLang] = { title: tTitle, text: tText };
                        renderTranslatePreview();
                    } catch (err) {
                        translatePreviewEl.innerHTML = `<div class="diary-error show">${esc(t('entrySheet.translateFailed', 'Übersetzung fehlgeschlagen: '))}${esc(err.message)}</div>`;
                        translatePreviewEl.classList.add("show");
                    } finally {
                        btn.disabled = false;
                        btn.textContent = origLabel;
                    }
                });
            });

            div.querySelector("#entry-save").addEventListener("click", async () => {
                const title = titleInput.value.trim();
                const text = textArea.value.trim();
                const errEl = div.querySelector("#entry-error");
                const btn = div.querySelector("#entry-save");
                if (!title) { errEl.textContent = t('entrySheet.titleRequired', 'Bitte gib dem Tag einen Titel.'); errEl.classList.add("show"); return; }
                btn.disabled = true; btn.textContent = t('entrySheet.saving', 'Speichere …');
                const source = detectLang(title + " " + text);
                const payload = { title, text, photos: draftPhotos.slice(), origLang: source };
                // Any language not freshly (re-)translated for THIS exact text gets explicitly
                // cleared rather than left stale — otherwise editing an entry without re-clicking
                // translate would silently leave old, now-outdated translations behind.
                const freshKey = title + "::" + text;
                for (const tgt of otherLangs(source)) {
                    if (translatedFor === freshKey && translatedMap[tgt]) {
                        payload["title_" + tgt] = translatedMap[tgt].title;
                        payload["text_" + tgt] = translatedMap[tgt].text;
                    } else {
                        payload["title_" + tgt] = null;
                        payload["text_" + tgt] = null;
                    }
                }
                try {
                    if (existingEntry) {
                        await updateDoc(doc(db, "entries", existingEntry.id), payload);
                    } else {
                        payload.createdAt = serverTimestamp();
                        await addDoc(collection(db, "entries"), payload);
                    }
                    closeBackdrop();
                } catch (e) {
                    errEl.textContent = t('entrySheet.saveFailed', 'Speichern fehlgeschlagen: ') + e.message;
                    errEl.classList.add("show");
                    btn.disabled = false; btn.textContent = t('entrySheet.save', 'Speichern');
                }
            });
        }

        document.getElementById("diary-fab").addEventListener("click", () => openEntrySheet(null));

        // ---- Lightbox: swipe left/right (or the arrow buttons) to browse an entry's other photos ----
        let lightboxPhotos = [];
        let lightboxIndex = 0;

        function showLightboxImage() {
            document.getElementById("diary-lightbox-img").src = lightboxPhotos[lightboxIndex];
        }
        function lightboxNext() {
            if (lightboxPhotos.length < 2) return;
            lightboxIndex = (lightboxIndex + 1) % lightboxPhotos.length;
            showLightboxImage();
        }
        function lightboxPrev() {
            if (lightboxPhotos.length < 2) return;
            lightboxIndex = (lightboxIndex - 1 + lightboxPhotos.length) % lightboxPhotos.length;
            showLightboxImage();
        }
        function openLightbox(photos, index) {
            lightboxPhotos = photos;
            lightboxIndex = index;
            const multi = photos.length > 1;
            document.getElementById("lightbox-prev").style.display = multi ? "flex" : "none";
            document.getElementById("lightbox-next").style.display = multi ? "flex" : "none";
            showLightboxImage();
            document.getElementById("diary-lightbox").classList.add("show");
        }

        const lightboxEl = document.getElementById("diary-lightbox");
        document.getElementById("lightbox-close").addEventListener("click", (e) => {
            e.stopPropagation();
            lightboxEl.classList.remove("show");
        });
        document.getElementById("lightbox-prev").addEventListener("click", (e) => { e.stopPropagation(); lightboxPrev(); });
        document.getElementById("lightbox-next").addEventListener("click", (e) => { e.stopPropagation(); lightboxNext(); });
        lightboxEl.addEventListener("click", function (e) { if (e.target === this) this.classList.remove("show"); });

        let lightboxTouchStartX = null;
        let lightboxTouchMoved = false;
        lightboxEl.addEventListener("touchstart", (e) => {
            lightboxTouchStartX = e.changedTouches[0].clientX;
            lightboxTouchMoved = false;
        }, { passive: true });
        lightboxEl.addEventListener("touchmove", () => { lightboxTouchMoved = true; }, { passive: true });
        lightboxEl.addEventListener("touchend", (e) => {
            if (lightboxTouchStartX == null) return;
            const dx = e.changedTouches[0].clientX - lightboxTouchStartX;
            if (lightboxTouchMoved && Math.abs(dx) > 40) {
                if (dx < 0) lightboxNext(); else lightboxPrev();
                e.preventDefault();
            }
            lightboxTouchStartX = null;
        });
        document.addEventListener("keydown", (e) => {
            if (!lightboxEl.classList.contains("show")) return;
            if (e.key === "ArrowRight") lightboxNext();
            else if (e.key === "ArrowLeft") lightboxPrev();
            else if (e.key === "Escape") lightboxEl.classList.remove("show");
        });

        renderAuthStatus();
    </script>

</body>
</html>
