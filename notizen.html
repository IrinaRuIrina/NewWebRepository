<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title data-i18n="doc.title">Notizen</title>
    <script src="i18n-notizen.js"></script>
    <script src="i18n.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #6b6350; --accent-dark: #4a453a; --line: #e2ddd3; --text: #2e2b24; --text-soft: #5c5648; --bg: #f5f2ec; --surface: #fffefb; --danger: #a8422c; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        h1, h2 { font-family: 'Cormorant Garamond', serif; font-weight: 600; margin: 0; }

        .gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
        .gate-box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 2.2rem 1.8rem; max-width: 380px; width: 100%; box-shadow: 0 4px 24px rgba(40,35,20,0.08); }
        .gate-box h1 { font-size: 1.6rem; text-align: center; margin-bottom: 0.4rem; }
        .gate-box p.sub { text-align: center; color: var(--text-soft); font-size: 0.85rem; margin-bottom: 1.4rem; }
        .field { margin-bottom: 1rem; }
        .field label { display: block; font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 0.4rem; }
        .field input, .field textarea, .field select {
            width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 0.7rem 0.8rem;
            font-family: inherit; font-size: 1rem; background: #fff; color: var(--text); box-sizing: border-box;
        }
        .field textarea { resize: vertical; min-height: 7rem; }
        .btn { width: 100%; border-radius: 10px; padding: 0.8rem 1rem; font-size: 0.9rem; font-family: inherit; font-weight: 500; cursor: pointer; border: none; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-dark); }
        .btn-primary:disabled { opacity: 0.6; cursor: default; }
        .error { color: var(--danger); font-size: 0.82rem; margin-top: 0.8rem; text-align: center; display: none; }
        .error.show { display: block; }

        .app { display: none; max-width: 640px; margin: 0 auto; padding: 2rem 1.2rem 6rem; }
        .app.show { display: block; }
        .app-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.2rem; }
        .app-top h1 { font-size: 1.8rem; }
        .app-top button { background: none; border: none; color: var(--text-soft); text-decoration: underline; cursor: pointer; font-size: 0.78rem; }

        .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.3rem; }
        .filter-chip {
            border: 1px solid var(--line); background: var(--surface); color: var(--text-soft);
            border-radius: 999px; padding: 0.4rem 0.9rem; font-size: 0.78rem; cursor: pointer;
        }
        .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .note-empty { text-align: center; padding: 3rem 1rem; color: #9a927e; }

        .note-feed { display: flex; flex-direction: column; gap: 0.9rem; }
        .note { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; position: relative; cursor: pointer; }
        .note:hover { border-color: var(--accent); }
        .note-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.6rem; margin-bottom: 0.4rem; }
        .note-cat { font-size: 0.68rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent-dark); background: #ece7da; padding: 0.2rem 0.6rem; border-radius: 999px; }
        .note-date { font-size: 0.7rem; color: #9a927e; margin-top: 0.3rem; }
        .note-actions { display: flex; gap: 0.2rem; flex-shrink: 0; }
        .note-del, .note-edit { border: none; background: transparent; color: #b3a992; font-size: 0.9rem; cursor: pointer; padding: 0.3rem; border-radius: 6px; }
        .note-del:hover { color: var(--danger); background: #f1e5e0; }
        .note-edit:hover { color: var(--accent-dark); background: #ece7da; }
        .note-text { white-space: pre-wrap; line-height: 1.6; color: var(--text); margin: 0.4rem 0 0; }
        .note-text-preview {
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
            overflow: hidden; white-space: pre-wrap; line-height: 1.6; color: var(--text); margin: 0.4rem 0 0;
        }
        .note-more { font-size: 0.75rem; color: var(--accent-dark); margin-top: 0.3rem; }
        .note-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 0.5rem; margin-top: 0.7rem; }
        .note-photos img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; cursor: zoom-in; }
        .detail-cat { font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent-dark); background: #ece7da; padding: 0.25rem 0.7rem; border-radius: 999px; }
        .detail-date { font-size: 0.72rem; color: #9a927e; margin: 0.5rem 0 1rem; }
        .detail-text { white-space: pre-wrap; line-height: 1.7; color: var(--text); }

        .fab { position: fixed; bottom: 1.4rem; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; border: none; font-family: inherit; font-size: 0.85rem; font-weight: 500; padding: 0.85rem 1.6rem; border-radius: 999px; box-shadow: 0 6px 20px rgba(40,35,20,0.25); cursor: pointer; z-index: 10; }
        .fab:hover { background: var(--accent-dark); }

        .backdrop { position: fixed; inset: 0; background: rgba(20,18,12,0.45); z-index: 20; display: none; align-items: flex-end; justify-content: center; }
        .backdrop.show { display: flex; }
        .sheet { background: #fff; width: 100%; max-width: 640px; border-radius: 18px 18px 0 0; padding: 1.4rem 1.2rem 1.6rem; max-height: 88vh; overflow-y: auto; }
        .sheet h2 { font-size: 1.3rem; margin-bottom: 1rem; }
        .photo-picker { border: 1.5px dashed var(--line); border-radius: 10px; padding: 0.9rem; text-align: center; cursor: pointer; color: var(--text-soft); font-size: 0.85rem; display: block; }
        .photo-picker input { display: none; }
        .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 0.5rem; margin-top: 0.6rem; }
        .preview-item { position: relative; }
        .preview-item img { width: 100%; height: 75px; object-fit: cover; border-radius: 8px; }
        .preview-remove { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--danger); color: #fff; border: none; font-size: 0.75rem; cursor: pointer; }
        .sheet-actions { display: flex; gap: 0.7rem; margin-top: 1.1rem; }
        .btn-secondary { flex: 1; background: transparent; color: var(--text-soft); border: 1px solid var(--line); border-radius: 10px; padding: 0.8rem 1rem; font-family: inherit; font-size: 0.9rem; cursor: pointer; }
        .sheet-actions .btn-primary { flex: 1; }

        .lightbox { position: fixed; inset: 0; background: rgba(10,9,6,0.9); z-index: 40; display: none; align-items: center; justify-content: center; padding: 1.5rem; }
        .lightbox.show { display: flex; }
        .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }

        .lang-switch { display: flex; gap: 0.3rem; align-items: center; justify-content: center; margin-top: 1.2rem; }
        .lang-switch button {
            background: transparent; border: 1px solid var(--line); color: var(--text-soft);
            font-family: 'Montserrat', sans-serif; font-size: 0.7rem; letter-spacing: 0.05em;
            padding: 0.25rem 0.55rem; border-radius: 20px; cursor: pointer; opacity: 0.75;
        }
        .lang-switch button:hover { opacity: 1; }
        .lang-switch button.active { opacity: 1; background: #ece7da; font-weight: 500; }
        .app-top .lang-switch { margin-top: 0; }
    </style>
</head>
<body>

    <div class="gate" id="gate">
        <div class="gate-box">
            <h1 data-i18n="gate.title">🔒 Notizen</h1>
            <p class="sub" data-i18n="gate.sub">Privater Bereich — nur mit Login sichtbar.</p>
            <div class="field"><label for="g-email" data-i18n="gate.email">E-Mail</label><input type="email" id="g-email" autocomplete="email"></div>
            <div class="field"><label for="g-pw" data-i18n="gate.password">Passwort</label><input type="password" id="g-pw" autocomplete="current-password"></div>
            <button class="btn btn-primary" id="g-submit" data-i18n="gate.submit">Anmelden</button>
            <p class="error" id="g-error"></p>
            <div class="lang-switch">
                <button data-lang="de" onclick="I18N_setLang('de')">DE</button>
                <button data-lang="en" onclick="I18N_setLang('en')">EN</button>
                <button data-lang="ru" onclick="I18N_setLang('ru')">RU</button>
            </div>
        </div>
    </div>

    <div class="app" id="app">
        <div class="app-top">
            <h1 data-i18n="app.title">Meine Notizen</h1>
            <div class="lang-switch">
                <button data-lang="de" onclick="I18N_setLang('de')">DE</button>
                <button data-lang="en" onclick="I18N_setLang('en')">EN</button>
                <button data-lang="ru" onclick="I18N_setLang('ru')">RU</button>
            </div>
            <button id="logout-btn" data-i18n="app.logout">Abmelden</button>
        </div>
        <div class="filters" id="filters"></div>
        <div id="feed"></div>
    </div>

    <button class="fab" id="fab" style="display:none" data-i18n="fab.newNote">+ Neue Notiz</button>
    <div class="lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import {
            getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
            onSnapshot, query, orderBy, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
        import {
            getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwpQ5RJhmg3EclFhCDxsvw7O8ExuA1jbs",
            authDomain: "camino-tagebuch.firebaseapp.com",
            projectId: "camino-tagebuch",
            storageBucket: "camino-tagebuch.firebasestorage.app",
            messagingSenderId: "496232405910",
            appId: "1:496232405910:web:e8eca9a786b91a67f59bb7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const CATEGORIES = ["Dankbarkeit", "Traum", "Buchauszug", "Gedanken zu Büchern", "Sonstiges"];
        const CATEGORY_KEY = {
            "Dankbarkeit": "cat.dankbarkeit", "Traum": "cat.traum", "Buchauszug": "cat.buchauszug",
            "Gedanken zu Büchern": "cat.gedanken", "Sonstiges": "cat.sonstiges"
        };
        let notes = [];
        let activeFilter = "Alle";
        let draftPhotos = [];
        let unsubscribe = null;

        function esc(s) {
            return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
                ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        function t(key, fallback) {
            const lang = (window.I18N_getLang && window.I18N_getLang()) || "de";
            const dict = (window.I18N && window.I18N[lang]) || {};
            return dict[key] != null ? dict[key] : fallback;
        }

        function categoryLabel(cat) {
            return cat === "Alle" ? t("cat.alle", "Alle") : t(CATEGORY_KEY[cat], cat);
        }

        function formatDate(ts) {
            try {
                const d = ts && ts.toDate ? ts.toDate() : new Date(ts);
                const lang = (window.I18N_getLang && window.I18N_getLang()) || "de";
                const locale = lang === "en" ? "en-GB" : lang === "ru" ? "ru-RU" : "de-DE";
                return d.toLocaleString(locale, { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
            } catch (e) { return ""; }
        }

        function renderFilters() {
            const el = document.getElementById("filters");
            const all = ["Alle", ...CATEGORIES];
            el.innerHTML = all.map(c =>
                `<button class="filter-chip ${c === activeFilter ? "active" : ""}" data-filter="${esc(c)}">${esc(categoryLabel(c))}</button>`).join("");
            el.querySelectorAll("[data-filter]").forEach(btn => {
                btn.addEventListener("click", () => { activeFilter = btn.getAttribute("data-filter"); renderFilters(); renderFeed(); });
            });
        }

        document.addEventListener("i18n:applied", () => { renderFilters(); renderFeed(); });

        function renderFeed() {
            const feed = document.getElementById("feed");
            const shown = activeFilter === "Alle" ? notes : notes.filter(n => n.category === activeFilter);
            if (!shown.length) {
                feed.innerHTML = `<div class="note-empty">${esc(t('empty.text', 'Noch keine Notizen'))}${activeFilter !== "Alle" ? esc(t('empty.inCategory', ' in dieser Kategorie')) : ""}.</div>`;
                return;
            }
            feed.innerHTML = `<div class="note-feed">${shown.map(n => `
                <article class="note" data-open="${esc(n.id)}">
                    <div class="note-head">
                        <div><span class="note-cat">${esc(categoryLabel(n.category))}</span><div class="note-date">${esc(formatDate(n.createdAt))}</div></div>
                        <div class="note-actions">
                            <button class="note-edit" data-edit="${esc(n.id)}" aria-label="${esc(t('note.edit', 'Bearbeiten'))}">✏️</button>
                            <button class="note-del" data-del="${esc(n.id)}" aria-label="${esc(t('note.delete', 'Löschen'))}">✕</button>
                        </div>
                    </div>
                    ${n.text ? `<p class="note-text-preview">${esc(n.text)}</p><p class="note-more">${esc(t('note.readMore', 'Weiterlesen →'))}</p>` : ""}
                    ${(n.photos || []).length ? `<div class="note-photos">${n.photos.map(p => `<img src="${p}" alt="${esc(t('photo.alt', 'Foto'))}">`).join("")}</div>` : ""}
                </article>`).join("")}</div>`;

            feed.querySelectorAll("[data-open]").forEach(card => {
                card.addEventListener("click", (e) => {
                    if (e.target.closest("[data-del],[data-edit],img")) return;
                    const note = notes.find(n => n.id === card.getAttribute("data-open"));
                    if (note) openDetailView(note);
                });
            });
            feed.querySelectorAll("[data-edit]").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const note = notes.find(n => n.id === btn.getAttribute("data-edit"));
                    if (note) openNoteForm(note);
                });
            });
            feed.querySelectorAll("[data-del]").forEach(btn => {
                btn.addEventListener("click", (e) => { e.stopPropagation(); deleteNote(btn.getAttribute("data-del"), btn); });
            });
            feed.querySelectorAll(".note-photos img").forEach(img => {
                img.addEventListener("click", (e) => {
                    e.stopPropagation();
                    document.getElementById("lightbox-img").src = img.src;
                    document.getElementById("lightbox").classList.add("show");
                });
            });
        }

        async function deleteNote(id, triggerBtn) {
            if (!confirm(t('note.delete.confirm', 'Notiz wirklich löschen?'))) return;
            if (triggerBtn) triggerBtn.disabled = true;
            try {
                await deleteDoc(doc(db, "private_notes", id));
                closeBackdrop();
            } catch (e) {
                alert(t('note.delete.failed', 'Löschen fehlgeschlagen: ') + e.message);
                if (triggerBtn) triggerBtn.disabled = false;
            }
        }

        function openDetailView(note) {
            const photos = (note.photos || []).map(p => `<img src="${p}" alt="${esc(t('photo.alt', 'Foto'))}">`).join("");
            const div = openBackdrop(`
                <span class="detail-cat">${esc(categoryLabel(note.category))}</span>
                <div class="detail-date">${esc(formatDate(note.createdAt))}</div>
                ${note.text ? `<p class="detail-text">${esc(note.text)}</p>` : ""}
                ${photos ? `<div class="note-photos" style="margin-top:1rem">${photos}</div>` : ""}
                <div class="sheet-actions">
                    <button type="button" class="btn-secondary" id="detail-edit">${esc(t('note.edit', 'Bearbeiten'))}</button>
                    <button type="button" class="btn-secondary" id="detail-del" style="color:var(--danger);border-color:var(--danger)">${esc(t('note.delete', 'Löschen'))}</button>
                </div>`);
            div.querySelector("#detail-edit").addEventListener("click", () => openNoteForm(note));
            div.querySelector("#detail-del").addEventListener("click", (e) => deleteNote(note.id, e.target));
            div.querySelectorAll(".note-photos img").forEach(img => {
                img.addEventListener("click", () => {
                    document.getElementById("lightbox-img").src = img.src;
                    document.getElementById("lightbox").classList.add("show");
                });
            });
        }

        function startListening() {
            if (unsubscribe) return;
            unsubscribe = onSnapshot(query(collection(db, "private_notes"), orderBy("createdAt", "desc")), (snap) => {
                notes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderFeed();
            }, (err) => {
                document.getElementById("feed").innerHTML = `<div class="note-empty">${esc(t('count.error', 'Fehler beim Laden.'))}</div>`;
                console.error(err);
            });
        }
        function stopListening() {
            if (unsubscribe) { unsubscribe(); unsubscribe = null; }
            notes = [];
        }

        onAuthStateChanged(auth, (user) => {
            const gate = document.getElementById("gate");
            const appEl = document.getElementById("app");
            const fab = document.getElementById("fab");
            if (user) {
                gate.style.display = "none";
                appEl.classList.add("show");
                fab.style.display = "block";
                renderFilters();
                startListening();
            } else {
                gate.style.display = "flex";
                appEl.classList.remove("show");
                fab.style.display = "none";
                stopListening();
            }
        });

        document.getElementById("g-submit").addEventListener("click", async () => {
            const email = document.getElementById("g-email").value.trim();
            const pw = document.getElementById("g-pw").value;
            const btn = document.getElementById("g-submit");
            const errEl = document.getElementById("g-error");
            btn.disabled = true; btn.textContent = t('gate.checking', 'Prüfe …');
            try { await signInWithEmailAndPassword(auth, email, pw); }
            catch (e) {
                errEl.textContent = t('gate.failed', 'Anmeldung fehlgeschlagen — E-Mail oder Passwort falsch.');
                errEl.classList.add("show");
            }
            btn.disabled = false; btn.textContent = t('gate.submit', 'Anmelden');
        });
        document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));

        function resizeImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error("read-failed"));
                reader.onload = () => {
                    const img = new Image();
                    img.onerror = () => reject(new Error("decode-failed"));
                    img.onload = () => {
                        const maxDim = 1100;
                        let w = img.width, h = img.height;
                        if (w > maxDim || h > maxDim) {
                            if (w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
                            else { w = Math.round(w * (maxDim / h)); h = maxDim; }
                        }
                        const canvas = document.createElement("canvas");
                        canvas.width = w; canvas.height = h;
                        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL("image/jpeg", 0.62));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function openBackdrop(html) {
            closeBackdrop();
            const div = document.createElement("div");
            div.className = "backdrop show";
            div.id = "note-backdrop";
            div.innerHTML = `<div class="sheet">${html}</div>`;
            document.body.appendChild(div);
            div.addEventListener("click", (e) => { if (e.target === div) closeBackdrop(); });
            return div;
        }
        function closeBackdrop() {
            const b = document.getElementById("note-backdrop");
            if (b) b.remove();
            draftPhotos = [];
        }

        function renderPreviewGrid(container) {
            container.innerHTML = draftPhotos.map((p, i) => `
                <div class="preview-item"><img src="${p}" alt="${esc(t('preview.alt', 'Vorschau'))}">
                <button type="button" class="preview-remove" data-remove="${i}">✕</button></div>`).join("");
            container.querySelectorAll("[data-remove]").forEach(btn => {
                btn.addEventListener("click", () => { draftPhotos.splice(Number(btn.getAttribute("data-remove")), 1); renderPreviewGrid(container); });
            });
        }

        function openNoteForm(existingNote) {
            const div = openBackdrop(`
                <h2>${existingNote ? esc(t('form.editTitle', 'Notiz bearbeiten')) : esc(t('form.newTitle', 'Neue Notiz'))}</h2>
                <div class="field"><label for="n-cat">${esc(t('form.category', 'Kategorie'))}</label>
                    <select id="n-cat">${CATEGORIES.map(c => `<option value="${esc(c)}" ${existingNote && existingNote.category === c ? "selected" : ""}>${esc(categoryLabel(c))}</option>`).join("")}</select>
                </div>
                <div class="field"><label for="n-text">${esc(t('form.text', 'Text'))}</label><textarea id="n-text" placeholder="${esc(t('form.textPlaceholder', 'Schreib, was dir gerade wichtig ist …'))}">${existingNote ? esc(existingNote.text || "") : ""}</textarea></div>
                <div class="field"><label>${esc(t('form.photoLabel', 'Foto (optional)'))}</label>
                    <label class="photo-picker">${esc(t('form.addPhoto', '📷 Foto hinzufügen'))}<input type="file" id="n-photos" accept="image/*" multiple></label>
                    <div class="preview-grid" id="n-preview"></div>
                </div>
                <p class="error" id="n-error"></p>
                <div class="sheet-actions">
                    <button type="button" class="btn-secondary" id="n-cancel">${esc(t('form.cancel', 'Abbrechen'))}</button>
                    <button type="button" class="btn btn-primary" id="n-save">${esc(t('form.save', 'Speichern'))}</button>
                </div>`);
            draftPhotos = existingNote ? (existingNote.photos || []).slice() : [];
            const previewEl = div.querySelector("#n-preview");
            renderPreviewGrid(previewEl);
            div.querySelector("#n-cancel").addEventListener("click", closeBackdrop);
            div.querySelector("#n-photos").addEventListener("change", async (e) => {
                for (const f of Array.from(e.target.files || [])) {
                    try { draftPhotos.push(await resizeImage(f)); } catch (err) {}
                }
                renderPreviewGrid(previewEl);
                e.target.value = "";
            });
            div.querySelector("#n-save").addEventListener("click", async () => {
                const category = div.querySelector("#n-cat").value;
                const text = div.querySelector("#n-text").value.trim();
                const errEl = div.querySelector("#n-error");
                const btn = div.querySelector("#n-save");
                if (!text && !draftPhotos.length) { errEl.textContent = t('form.required', 'Bitte Text oder Foto hinzufügen.'); errEl.classList.add("show"); return; }
                btn.disabled = true; btn.textContent = t('form.saving', 'Speichere …');
                try {
                    if (existingNote) {
                        await updateDoc(doc(db, "private_notes", existingNote.id), { category, text, photos: draftPhotos.slice() });
                    } else {
                        await addDoc(collection(db, "private_notes"), { category, text, photos: draftPhotos.slice(), createdAt: serverTimestamp() });
                    }
                    closeBackdrop();
                } catch (e) {
                    errEl.textContent = t('form.saveFailed', 'Speichern fehlgeschlagen: ') + e.message;
                    errEl.classList.add("show");
                    btn.disabled = false; btn.textContent = t('form.save', 'Speichern');
                }
            });
        }

        document.getElementById("fab").addEventListener("click", () => openNoteForm(null));

        document.getElementById("lightbox").addEventListener("click", function () { this.classList.remove("show"); });
    </script>
</body>
</html>
