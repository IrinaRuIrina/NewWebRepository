<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title data-i18n="doc.title">Notizen</title>
    <script src="js/uebersetzungen/notizen.js"></script>
    <script src="js/i18n.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/notizen.css">
</head>
<body>

    <div class="gate" id="gate">
        <div class="gate-box">
            <h1 data-i18n="gate.title">🔒 Notizen</h1>
            <p class="sub" data-i18n="gate.sub">Privater Bereich — nur mit Login sichtbar.</p>
            <div class="field"><label for="g-email" data-i18n="gate.email">E-Mail</label><input type="email" id="g-email" autocomplete="email"></div>
            <div class="field"><label for="g-pw" data-i18n="gate.password">Passwort</label><input type="password" id="g-pw" autocomplete="current-password"></div>
            <button class="btn btn-primary" id="g-submit" data-i18n="gate.submit">Anmelden</button>
            <p class="error" id="g-error"></p>
            <div class="lang-switch">
                <button data-lang="de" onclick="I18N_setLang('de')">DE</button>
                <button data-lang="en" onclick="I18N_setLang('en')">EN</button>
                <button data-lang="ru" onclick="I18N_setLang('ru')">RU</button>
            </div>
        </div>
    </div>

    <div class="app" id="app">
        <div class="app-top">
            <h1 data-i18n="app.title">Meine Notizen</h1>
            <div class="lang-switch">
                <button data-lang="de" onclick="I18N_setLang('de')">DE</button>
                <button data-lang="en" onclick="I18N_setLang('en')">EN</button>
                <button data-lang="ru" onclick="I18N_setLang('ru')">RU</button>
            </div>
            <button id="logout-btn" data-i18n="app.logout">Abmelden</button>
        </div>
        <div class="filters" id="filters"></div>
        <div id="feed"></div>
    </div>

    <button class="fab" id="fab" style="display:none" data-i18n="fab.newNote">+ Neue Notiz</button>
    <div class="lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>

    <script type="module" src="js/notizen.js"></script>
</body>
</html>
